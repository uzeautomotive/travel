# Төслийн бүх хэсгийг (өгөгдлийн сан, backend, frontend) нэг командаар асаана.
services:

  # ---------- 1. Өгөгдлийн сан ----------
  db:
    image: postgres:16                      # Postgres-ийн 16-р хувилбар
    restart: unless-stopped                 # Компьютер дахин асахад өөрөө асна
    environment:
      POSTGRES_USER: student                # Хэрэглэгчийн нэр
      POSTGRES_PASSWORD: ${DB_PASSWORD}     # Нууц үг: .env файлаас авна (кодод бичихгүй)
      POSTGRES_DB: travel                   # Үүсгэх сангийн нэр
    volumes:
      - db_data:/var/lib/postgresql/data    # Өгөгдлийг хадгална, container устсан ч алга болохгүй
      # Анх асахад л (сан хоосон үед) энэ SQL файлыг автоматаар ачаална
      - ./synthetic_data.sql:/docker-entrypoint-initdb.d/synthetic_data.sql:ro
    # ports: байхгүй => гаднаас хандах боломжгүй, зөвхөн backend л харна
    healthcheck:                            # Сан бэлэн болсныг шалгана
      test: ["CMD-SHELL", "pg_isready -U student -d travel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 2. Backend (FastAPI) ----------
  backend:
    build: ./travel-backend                 # travel-backend доторх Dockerfile-аас image бүтээнэ
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy          # Сан бүрэн бэлэн болсны дараа л эхэлнэ
    environment:
      # "db" гэдэг нь дээрх service-ийн нэр, docker сүлжээнд хаяг болж ажиллана
      DATABASE_URL: postgresql://student:${DB_PASSWORD}@db:5432/travel
      ALLOWED_ORIGINS: http://${EC2_IP}     # Зөвхөн энэ хаягаас ирсэн хүсэлтийг зөвшөөрнө (CORS)
      MODEL_PATH: demand_model.joblib       # Image дотор хуулагдсан AI загвар
      JWT_SECRET: ${JWT_SECRET}             # Нэвтрэх токены нууц түлхүүр: .env-ээс
      JWT_EXPIRE_MINUTES: "60"              # Токен 60 минут хүчинтэй
    ports:
      - "8000:8000"                         # Гаднаас 8000 порт руу хандахыг backend-д холбоно

  # ---------- 3. Frontend (nginx) ----------
  frontend:
    image: nginx:alpine                     # Жижиг, хөнгөн вэб сервер
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # Frontend файлуудыг nginx-ийн нийтийн хавтас руу холбоно (зөвхөн унших)
      - ./travel-frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"                             # Вэб хуудас 80 порт (энгийн http) дээр нээгдэнэ

# Өгөгдлийн сангийн файлуудыг хадгалах нэрлэсэн хадгалалт
volumes:
  db_data:
